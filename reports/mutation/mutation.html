@warpgogol/fingerprint directly.<"+"/item>\n<"+"/CHANGE_SUMMARY>\n ***************************************************************/\n\n/**\n * Build artifact collection and provenance creation.\n * Computes hashes of dist files and creates signed build metadata.\n */\n\nimport path from \"node:path\";\nimport { byteHash, byteHashFile } from \"@warpgogol/werkstatt-engine/fingerprint\";\nimport { discoverManagedFiles } from \"./discover.ts\";\nimport { discoverDistFiles } from \"./internal-dist.ts\";\nimport { getHeadSha, getRepoUrl } from \"./git.ts\";\nimport { writeJsonFile } from \"./json.ts\";\nimport { outputsPath, provenancePath } from \"./paths.ts\";\nimport type { BuildProvenance, OutputsFile } from \"./types.ts\";\n\nexport async function collectBuildOutputs(cwd: string, distDir = \"dist\"): Promise<"+"OutputsFile> {\n  const buildId = new Date().toISOString().replace(/[:.]/g, \"-\");\n  const outputs: Record<"+"string, string> = {};\n  const files = await discoverDistFiles(cwd, distDir);\n  for (const file of files) {\n    outputs[file] = await byteHashFile(path.join(cwd, file));\n  }\n  return { buildId, outputs };\n}\n\nexport async function buildInputsDigest(cwd: string): Promise<"+"string> {\n  const files = await discoverManagedFiles(cwd);\n  const entries = await Promise.all(\n    files.map(async (file) => `${file}\\t${await byteHashFile(path.join(cwd, file))}`),\n  );\n  const combined = entries.join(\"\\n\");\n  return byteHash(combined);\n}\n\nexport async function createBuildProvenance(args: {\n  cwd: string;\n  builder: string;\n  outputs: OutputsFile;\n}): Promise<"+"BuildProvenance> {\n  const started = new Date().toISOString();\n  const outputsDigest = byteHash(JSON.stringify(args.outputs.outputs));\n  const inputsDigest = await buildInputsDigest(args.cwd);\n  const finished = new Date().toISOString();\n\n  return {\n    buildId: args.outputs.buildId,\n    sourceRepo: (await getRepoUrl(args.cwd)) ?? \"unknown\",\n    sourceCommit: (await getHeadSha(args.cwd)) ?? \"unknown\",\n    builder: args.builder,\n    buildStartedAt: started,\n    buildFinishedAt: finished,\n    inputsDigest,\n    outputsDigest,\n  };\n}\n\nexport async function writeBuildArtifacts(args: {\n  cwd: string;\n  outputs: OutputsFile;\n  provenance: BuildProvenance;\n}): Promise<"+"void> {\n  await writeJsonFile(outputsPath(args.cwd), args.outputs);\n  await writeJsonFile(provenancePath(args.cwd), args.provenance);\n}\n"},"src/integrity/compass-audit-helpers.ts":{"language":"typescript","mutants":[{"id":"17","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":2,"line":66},"start":{"column":34,"line":29}}},{"id":"18","mutatorName":"ConditionalExpression","replacement":"true","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":15,"line":33},"start":{"column":7,"line":33}}},{"id":"19","mutatorName":"ConditionalExpression","replacement":"false","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":15,"line":33},"start":{"column":7,"line":33}}},{"id":"20","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":4,"line":52},"start":{"column":17,"line":33}}},{"id":"21","mutatorName":"ConditionalExpression","replacement":"true","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":15,"line":36},"start":{"column":9,"line":36}}},{"id":"22","mutatorName":"ConditionalExpression","replacement":"false","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":15,"line":36},"start":{"column":9,"line":36}}},{"id":"23","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":6,"line":51},"start":{"column":17,"line":36}}},{"id":"24","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[], ry hash\n      }\n      return {\n        revision: entity.revision,\n        entityId,\n        contentHash,\n      };\n    }\n  }\n\n  // Fallback: compute revision from git history\n  const revision = await getFileRevisionFromHistory(cwd, repoPath);\n  let contentHash = \"\";\n  try {\n    const abs = resolve(cwd, repoPath);\n    const content = await readFile(abs, \"utf8\");\n    contentHash = \"sha256-\" + createHash(\"sha256\").update(content).digest(\"hex\");\n  } catch {\n    // file may not exist\n  }\n\n  return { revision, entityId: null, contentHash };\n}\n"},"src/integrity/discover.ts":{"language":"typescript","mutants":[{"id":"37","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":2,"line":31},"start":{"column":76,"line":24}}},{"id":"38","mutatorName":"MethodExpression","replacement":"tracked.map(filePath => filePath.replace(/\\\\/g, \"/\")).filter(filePath => isManagedPath(filePath, policy))","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":40,"line":30},"start":{"column":10,"line":27}}},{"id":"39","mutatorName":"MethodExpression","replacement":"tracked.map(filePath => filePath.replace(/\\\\/g, \"/\"))","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":59,"line":29},"start":{"column":10,"line":27}}},{"id":"40","mutatorName":"ArrowFunction","replacement":"() => undefined","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":52,"line":28},"start":{"column":10,"line":28}}},{"id":"41","mutatorName":"StringLiteral","replacement":"\"\"","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":51,"line":28},"start":{"column":48,"line":28}}},{"id":"42","mutatorName":"ArrowFunction","replacement":"() => undefined","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":58,"line":29},"start":{"column":13,"line":29}}},{"id":"43","mutatorName":"ArrowFun  buildLatestDir,\n  compareManifestWithLocalArtifacts,\n  ensureDir,\n  generateSigningKeyPairPemAsync,\n  loadPublicKeyPem,\n  loadSignedManifest,\n  optionalEnv,\n  requireEnv,\n  runBackfillRevisions,\n  runInit,\n  runRecordBuild,\n  runUpdate,\n  runVerify,\n  signedManifestPath,\n  signLatestBuildArtifacts,\n  verifyManifestSignature,\n  writeText,\n} from \"@warpgogol/werkstatt-engine/integrity\";\n\nfunction requireApp(context: KernelRuntimeContext) {\n  if (!context.site) {\n    throw new Error(\"This command requires an app-scoped runtime context.\");\n  }\n  return context.site;\n}\n\nfunction getStringArg(\n  input: KernelCommandInput,\n  index: number,\n  fallback?: string,\n): string | undefined {\n  return fallback;\n}\n\nexport async function runIntegrityInit(\n  _input: KernelCommandInput,\n  context: KernelRuntimeContext,\n): Promise<"+"KernelCommandResult> {\n  const app = requireApp(context);\n  if (context.dryRun) {\n    return { summary: `[integrity.init] dry-run: would initialize integrity for ${app.name}` };\n  }\n\n  await runInit({ cwd: app.directory });\n  return {\n    summary: `[integrity.init] complete for ${app.name}`,\n    nextSteps: [\n      {\n        action: `Update integrity manifests: pnpm exec werkstatt run integrity.update`,\n        kind: \"optional\",\n      },\n    ],\n  };\n}\n\nexport async function runIntegrityUpdate(\n  input: KernelCommandInput,\n  context: KernelRuntimeContext,\n): Promise<"+"KernelCommandResult> {\n  const app = requireApp(context);\n  if (context.dryRun) {\n    return {\n      summary: `[integrity.update] dry-run: would update integrity manifests for ${app.name}`,\n    };\n  }\n\n  await runUpdate({ cwd: app.directory, baseRef: getStringArg(input, 0) });\n  return {\n    summary: `[integrity.update] complete for ${app.name}`,\n    nextSteps: [\n      { action: `Verify integrity: pnpm exec werkstatt run integrity.verify`, kind: \"optional\" },\n    ],\n  };\n}\n\nexport async function runIntegrityVerify(\n  _input: KernelCommandInput,\n  context: KernelRuntimeContext,\n): Promise<"+"KernelCommandResult<"+"{ ok: boolean }>> {\n  const app = requireApp(context);\n  const report = await runVerify({ cwd: app.directory });\n  return {\n    data: { ok: report.ok },\n    exitCode: report.ok ? 0 : 1,\n    summary: report.ok ? \"Integrity verification passed.\" : undefined,\n    nextSteps: report.ok\n      ? undefined\n      : [\n          {\n            action: `Fix the integrity violations above, then re-run: pnpm exec werkstatt run integrity.verify`,\n            kind: \"required\",\n          },\n        ],\n  };\n}\n\nexport async function runIntegrityBuildRecord(\n  input: KernelCommandInput,\n  context: KernelRuntimeContext,\n): Promise<"+"KernelCommandResult> {\n  const app = requireApp(context);\n  const distDir = getStringArg(input, 0, \"dist\") ?? \"dist\";\n  if (context.dryRun) {\n    return {\n      summary: `[integrity.build-record] dry-run: would record build outputs from ${distDir}`,\n    };\n  }\n\n  await runRecordBuild({ cwd: app.directory, builder: \"local\", distDir });\n  return {\n    summary: `[integrity.build-record] complete for ${app.name}`,\n    nextSteps: [\n      { action: `Sign the build: pnpm exec werkstatt run integrity.sign`, kind: \"optional\" },\n    ],\n  };\n}\n\nasync function loadPrivateKeyPem(appDirectory: string): Promise<"+"string> {\n  const keyPath = await optionalEnv(\"SIGNING_PRIVATE_KEY_PATH\", appDirectory);\n  if (keyPath) {\n    return fs.readFile(path.resolve(appDirectory, keyPath), \"utf8\");\n  }\n\n  const defaultKeyPath = path.join(appDirectory, \".integrity/keys/studio.private.pem\");\n  try {\n    return await fs.readFile(defaultKeyPath, \"utf8\");\n  } catch {\n    // Fallback to env variable\n  }\n\n  return requireEnv(\"SIGNING_PRIVATE_KEY\", appDirectory);\n}\n\nexport async function runIntegritySign(\n  _input: KernelCommandInput,\n  context: KernelRuntimeContext,\n): Promise<"+"KernelCommandResult<"+"{ reusedExistingSignature: boolean }>> {\n  const app = requireApp(context);\n  if (context.dryRun) {\n    return { summary: `[integrity.sign] dry-run: would sign ${buildLatestDir(app.directory)}` };\n  }\n\n  const privateKeyPem = await loadPrivateKeyPem(app.directory);\n  const publicKeyUrl = await optionalEnv(\"PUBLIC_KEY_URL\", app.directory);\n  const result = await signLatestBuildArtifacts({\n    cwd: app.directory,\n    privateKeyPem,\n    publicKeyUrl,\n  });\n\n  context.logger.info(`Build directory: ${buildLatestDir(app.directory)}`);\n  context.logger.info(\n    `Public key URL: ${publicKeyUrl ?? \"(embedded URL omitted for this signature)\"}`,\n  );\n  context.logger.info(`Build ID: ${result.payload.buildId}`);\n  context.logger.info(`Signed at: ${result.payload.signedAt}`);\n  context.logger.info(`Outputs digest: ${result.payload.outputsDigest}`);\n  context.logger.info(`Provenance digest: ${result.payload.provenanceDigest}`);\n  context.logger.info(`Output files: ${Object.keys(result.outputs.outputs).length}`);\n  context.logger.info(`Signature bytes: ${result.signatureBuffer.byteLength}`);\n  context.logger.info(`Signature preview: ${result.signatureHex.slice(0, 32)}...`);\n  context.logger.info(`Signed manifest: ${signedManifestPath(app.directory)}`);\n\n  return {\n    data: { reusedExistingSignature: result.reusedExistingSignature },\n    summary: result.reusedExistingSignature\n      ? \"Release signature already matched the current build artifacts. Existing signed files were kept unchanged.\"\n      : \"Release signed successfully. Anyone holding your public key can verify this release independently.\",\n  };\n}\n\nexport async function runIntegrityVerifyRelease(\n  input: KernelCommandInput,\n  context: KernelRuntimeContext,\n): Promise<"+"KernelCommandResult<"+"{ signatureValid: boolean }>> {\n  const app = requireApp(context);\n  const manifestSource =\n    getStringArg(input, 0, signedManifestPath(app.directory)) ?? signedManifestPath(app.directory);\n  const manifest = await loadSignedManifest(manifestSource);\n  const publicKeyPemPath = await optionalEnv(\"PUBLIC_KEY_PEM_PATH\", app.directory);\n  const publicKeyUrl = await optionalEnv(\"PUBLIC_KEY_URL\", app.directory);\n\n  // Fallback to default public key location if no other source provided\n  let resolvedKeyPath: string | undefined = publicKeyPemPath;\n  if (!resolvedKeyPath && !publicKeyUrl && !manifest.publicKeyUrl) {\n    const defaultPublicKeyPath = path.join(app.directory, \"public/studio.public.pem\");\n    try {\n      await fs.access(defaultPublicKeyPath);\n      resolvedKeyPath = defaultPublicKeyPath;\n    } catch {\n      // No default key file, will fail below with proper error\n    }\n  }\n\n  // Resolve relative paths against app.directory (loadPublicKeyPem uses path.resolve against process.cwd())\n  if (resolvedKeyPath && !path.isAbsolute(resolvedKeyPath)) {\n    resolvedKeyPath = path.resolve(app.directory, resolvedKeyPath);\n  }\n\n  const publicKeyPem = await loadPublicKeyPem({\n    manifest,\n    publicKeyPemPath: resolvedKeyPath,\n    publicKeyUrl,\n  });\n  const signatureValid = await verifyManifestSignature({ manifest, publicKeyPem });\n\n  context.logger.info(`Manifest source: ${manifestSource}`);\n  context.logger.info(`Build ID: ${manifest.buildId}`);\n  context.logger.info(`Signed at: ${manifest.signedAt}`);\n  context.logger.info(`Algorithm: ${manifest.algorithm}`);\n  context.logger.info(\n    `Public key source: ${publicKeyPemPath ?? publicKeyUrl ?? manifest.publicKeyUrl ?? \"(not provided)\"}`,\n  );\n  context.logger.info(`Payload version: ${manifest.payloadVersion}`);\n  context.logger.info(`Outputs digest: ${manifest.payload.outputsDigest}`);\n  context.logger.info(`Provenance digest: ${manifest.payload.provenanceDigest}`);\n  context.logger.info(`Result: ${signatureValid ? \"VALID\" : \"INVALID\"}`);\n\n  let localCheckFailed = false;\n  const localBuildDir = buildLatestDir(app.directory);\n  if (\n    !manifestSource.startsWith(\"https://\") &&\n    path.resolve(manifestSource).startsWith(path.resolve(localBuildDir))\n  ) {\n    const digestCheck = await compareManifestWithLocalArtifacts(app.directory, manifest);\n    context.logger.info(`outputs.json: ${digestCheck.outputsDigestMatches ? \"MATCH\" : \"MISMATCH\"}`);\n    context.logger.info(\n      `build-provenance.json: ${digestCheck.provenanceDigestMatches ? \"MATCH\" : \"MISMATCH\"}`,\n    );\n    if (!digestCheck.outputsDigestMatches || !digestCheck.provenanceDigestMatches) {\n      localCheckFailed = true;\n    }\n  }\n\n  const ok = signatureValid && !localCheckFailed;\n  return {\n    data: { signatureValid },\n    exitCode: ok ? 0 : 1,\n    summary: ok\n      ? \"Release verified successfully. Anyone holding the public key can verify this release independently.\"\n      : undefined,\n  };\n}\n\nexport async function runIntegrityGenerateSigningKeypair(\n  input: KernelCommandInput,\n  context: KernelRuntimeContext,\n): Promise<"+"KernelCommandResult<"+"{ privateKeyTarget: string; publicKeyTarget: string }>> {\n  const app = requireApp(context);\n  const privateKeyTarget = path.resolve(\n    app.directory,\n    getStringArg(input, 0, \".integrity/keys/studio.private.pem\") ??\n      \".integrity/keys/studio.private.pem\",\n  );\n  const publicKeyTarget = path.resolve(\n    app.directory,\n    getStringArg(input, 1, \"public/studio.public.pem\") ?? \"public/studio.public.pem\",\n  );\n\n  if (context.dryRun) {\n    return {\n      data: { privateKeyTarget, publicKeyTarget },\n      summary: `[integrity.keys.generate] dry-run: would write ${privateKeyTarget} and ${publicKeyTarget}`,\n    };\n  }\n\n  const { privateKeyPem, publicKeyPem } = await generateSigningKeyPairPemAsync();\n  await ensureDir(path.dirname(privateKeyTarget));\n  await ensureDir(path.dirname(publicKeyTarget));\n  await Promise.all([\n    writeText(privateKeyTarget, privateKeyPem),\n    writeText(publicKeyTarget, publicKeyPem),\n  ]);\n\n  context.logger.info(`Private key: ${privateKeyTarget}`);\n  context.logger.info(`Public key: ${publicKeyTarget}`);\n  return {\n    data: { privateKeyTarget, publicKeyTarget },\n    summary: \"Ed25519 key pair generated.\",\n  };\n}\n\nexport async function runIntegrityBackfillRevisions(\n  _input: KernelCommandInput,\n  context: KernelRuntimeContext,\n): Promise<"+"KernelCommandResult> {\n  const app = requireApp(context);\n  if (context.dryRun) {\n    return {\n      summary: `[integrity.backfill-revisions] dry-run: would update revision counters for ${app.name}`,\n    };\n  }\n\n  await runBackfillRevisions({ cwd: app.directory });\n  return { summary: `[integrity.backfill-revisions] complete for ${app.name}` };\n}\n"},"src/integrity/internal-dist.ts":{"language":"typescript","mutants":[{"id":"514","mutatorName":"StringLiteral","replacement":"\"\"","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":70,"line":23},"start":{"column":64,"line":23}}},{"id":"515","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":2,"line":29},"start":{"column":91,"line":23}}},{"id":"516","mutatorName":"ObjectLiteral","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":65,"line":25},"start":{"column":42,"line":25}}},{"id":"517","mutatorName":"ArrowFunction","replacement":"() => undefined","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":63,"line":25},"start":{"column":52,"line":25}}},{"id":"518","mutatorName":"BooleanLiteral","replacement":"true","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":63,"line":25},"start":{"column":58,"line":25}}},{"id":"519","mutatorName":"MethodExpression","replacement":"files.map(abs => path.relative(cwd, abs).replace(/\\\\/g, \"/\"))","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":40,"line":28},"start":{"column":10,"line": .map(sortValue);\n  }\n  if (value && typeof value === \"object\") {\n    const entries = Object.entries(value as Record<"+"string, unknown>)\n      .sort(([a], [b]) => a.localeCompare(b))\n      .map(([key, nested]) => [key, sortValue(nested)]);\n    return Object.fromEntries(entries);\n  }\n  return value;\n}\n\nexport function stableStringify(value: unknown): string {\n  return `${JSON.stringify(sortValue(value), null, 2)}\\n`;\n}\n\nexport async function readJsonFile<"+"T>(filePath: string): Promise<"+"T> {\n  return JSON.parse(await readText(filePath)) as T;\n}\n\nexport async function writeJsonFile(filePath: string, value: unknown): Promise<"+"void> {\n  await ensureDir(path.dirname(filePath));\n  await writeText(filePath, stableStringify(value));\n}\n"},"src/integrity/manifests.ts":{"language":"typescript","mutants":[{"id":"542","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":2,"line":35},"start":{"column":38,"line":31}}},{"id":"543","mutatorName":"BooleanLiteral","replacement":"await pathExists(filePath)","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":36,"line":33},"start":{"column":7,"line":33}}},{"id":"544","mutatorName":"ConditionalExpression","replacement":"true","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":36,"line":33},"start":{"column":7,"line":33}}},{"id":"545","mutatorName":"ConditionalExpression","replacement":"false","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":36,"line":33},"start":{"column":7,"line":33}}},{"id":"546","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":2,"line":43},"start":{"column":18,"line":40}}},{"id":"547","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":2,"line":52},"start":{"column":73, oject/.integrity/build/latest' to be '/test/project/.integrity/build/latest…' // Object.is equality","status":"Killed","static":false,"testsCompleted":1,"killedBy":["116"],"coveredBy":["116"],"location":{"end":{"column":63,"line":99},"start":{"column":41,"line":99}}}],"source":"/*******************************************************************************  \n<"+"MODULE_CONTRACT>  \n<"+"purpose>Defines path utilities for managing integrity-related file locations within a specified working directory.<"+"/purpose>  \n  \n  \n<"+"non-goals>  \n  <"+"item>Do not handle file reading or writing operations.<"+"/item>  \n  <"+"item>Do not manage integrity validation or enforcement logic.<"+"/item>  \n  <"+"item>Do not parse raw content from files.<"+"/item>  \n<"+"/non-goals>  \n<"+"/MODULE_CONTRACT>  \n  \n<"+"CHANGE_SUMMARY>\n  <"+"item>Tidied by compass.changesummary.tidy; see git history for prior entries.<"+"/item>\n<"+"/CHANGE_SUMMARY>  \n******************************************************************************/\n\n/**\n * Path constants and utilities for integrity file locations.\n * Defines all paths within the .integrity directory structure.\n */\n\nimport path from \"node:path\";\n\nexport function integrityRoot(cwd: string): string {\n  return path.join(cwd, \".integrity\");\n}\n\nexport function configDir(cwd: string): string {\n  return path.join(integrityRoot(cwd), \"config\");\n}\n\nexport function schemaDir(cwd: string): string {\n  return path.join(integrityRoot(cwd), \"schema\");\n}\n\nexport function policyPath(cwd: string): string {\n  return path.join(configDir(cwd), \"policy.json\");\n}\n\nexport function indexDir(cwd: string): string {\n  return path.join(integrityRoot(cwd), \"index\");\n}\n\nexport function entitiesByIdPath(cwd: string): string {\n  return path.join(indexDir(cwd), \"entities.by-id.json\");\n}\n\nexport function currentPathsPath(cwd: string): string {\n  return path.join(indexDir(cwd), \"paths.current.json\");\n}\n\nexport function manifestsRoot(cwd: string): string {\n  return path.join(integrityRoot(cwd), \"manifests\");\n}\n\nexport function manifestPathForDirectory(cwd: string, repoDir: string): string {\n  const safeDir = repoDir === \".\" ? \"root\" : repoDir;\n  return path.join(manifestsRoot(cwd), safeDir, \"versions.json\");\n}\n\nexport function stateDir(cwd: string): string {\n  return path.join(integrityRoot(cwd), \"state\");\n}\n\nexport function deletedLogPath(cwd: string): string {\n  return path.join(stateDir(cwd), \"deleted-log.json\");\n}\n\nexport function movedLogPath(cwd: string): string {\n  return path.join(stateDir(cwd), \"moved-log.json\");\n}\n\nexport function buildDir(cwd: string): string {\n  return path.join(integrityRoot(cwd), \"build\");\n}\n\nexport function buildLatestDir(cwd: string): string {\n  return path.join(buildDir(cwd), \"latest\");\n}\n\nexport function outputsPath(cwd: string): string {\n  return path.join(buildLatestDir(cwd), \"outputs.json\");\n}\n\nexport function provenancePath(cwd: string): string {\n  return path.join(buildLatestDir(cwd), \"build-provenance.json\");\n}\n\nexport function signatureBinaryPath(cwd: string): string {\n  return path.join(buildLatestDir(cwd), \"signature.bin\");\n}\n\nexport function signatureHexPath(cwd: string): string {\n  return path.join(buildLatestDir(cwd), \"signature.hex\");\n}\n\nexport function signedManifestPath(cwd: string): string {\n  return path.join(buildLatestDir(cwd), \"signed-manifest.json\");\n}\n"},"src/integrity/policy.ts":{"language":"typescript","mutants":[{"id":"636","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":2,"line":26},"start":{"column":45,"line":24}}},{"id":"637","mutatorName":"Regex","replacement":"/[^|\\\\{}()[\\]^$+?.]/g","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":44,"line":25},"start":{"column":24,"line":25}}},{"id":"638","mutatorName":"StringLiteral","repla der: { type: \"string\", minLength: 1 },\n      buildStartedAt: { type: \"string\", format: \"date-time\" },\n      buildFinishedAt: { type: \"string\", format: \"date-time\" },\n      inputsDigest: {\n        type: \"string\",\n        pattern: \"^sha256:[0-9a-fA-F]{64}$\",\n      },\n      outputsDigest: {\n        type: \"string\",\n        pattern: \"^sha256:[0-9a-fA-F]{64}$\",\n      },\n    },\n  },\n} as const;\n\nasync function ensureSchemaFiles(cwd: string): Promise<"+"void> {\n  const root = schemaDir(cwd);\n\n  for (const [fileName, schema] of Object.entries(BOOTSTRAP_SCHEMAS)) {\n    const filePath = `${root}/${fileName}`;\n    if (await pathExists(filePath)) {\n      continue;\n    }\n\n    await writeJsonFile(filePath, schema);\n  }\n}\n\nexport async function ensurePolicyFile(cwd: string): Promise<"+"IntegrityPolicy> {\n  const filePath = policyPath(cwd);\n  await ensureSchemaFiles(cwd);\n\n  if (await pathExists(filePath)) {\n    return readJsonFile<"+"IntegrityPolicy>(filePath);\n  }\n\n  await writeJsonFile(filePath, BOOTSTRAP_POLICY);\n  return BOOTSTRAP_POLICY;\n}\n\nexport async function loadPolicy(cwd: string): Promise<"+"IntegrityPolicy> {\n  return ensurePolicyFile(cwd);\n}\n\nexport function isManagedPath(repoPath: string, policy: IntegrityPolicy): boolean {\n  const normalized = repoPath.replace(/\\\\/g, \"/\");\n  const excluded = policy.exclude.some((pattern) => globToRegExp(pattern).test(normalized));\n  if (excluded) return false;\n  return policy.include.some((pattern) => globToRegExp(pattern).test(normalized));\n}\n"},"src/integrity/registry.ts":{"language":"typescript","mutants":[{"id":"698","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":2,"line":28},"start":{"column":76,"line":24}}},{"id":"699","mutatorName":"BooleanLiteral","replacement":"await pathExists(filePath)","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":36,"l le entity creation or deletion beyond revision updates.<"+"/item>\n  <"+"item>Do not perform any operations related to transport or configuration orchestration.<"+"/item>\n  <"+"item>Do not parse raw content from files or directories.<"+"/item>\n<"+"/non-goals>\n<"+"/MODULE_CONTRACT>\n<"+"CHANGE_SUMMARY>\n  <"+"item>Refined the backfill process to ensure accurate revision counts for tracked entities.<"+"/item>\n<"+"/CHANGE_SUMMARY>\n*/\n\n/**\n * Annotation revision counts from Git history for all tracked entities.\n * Updates entities and manifests with accurate revision numbers.\n */\n\nimport path from \"node:path\";\nimport { getFileRevisionFromHistory } from \"./git.ts\";\nimport {\n  getManifestFileName,\n  loadDirectoryManifest,\n  saveDirectoryManifest,\n  upsertManifestRecord,\n} from \"./manifests.ts\";\nimport { readJsonFile, writeJsonFile } from \"./json.ts\";\nimport { deletedLogPath } from \"./paths.ts\";\nimport { loadEntitiesById, loadPathsCurrent, saveEntitiesById } from \"./registry.ts\";\nimport type { DeletedLogItem } from \"./types.ts\";\n\nexport async function runBackfillRevisions(args: { cwd: string }): Promise<"+"void> {\n  const { cwd } = args;\n  const entities = await loadEntitiesById(cwd);\n  const paths = await loadPathsCurrent(cwd);\n  const deletedLog = await readJsonFile<"+"DeletedLogItem[]>(deletedLogPath(cwd)).catch(() => []);\n  const deletedByEntityId = new Map(deletedLog.map((item) => [item.entityId, item]));\n  const manifestCache = new Map<"+"string, Awaited<"+"ReturnType<"+"typeof loadDirectoryManifest>>>();\n\n  let updatedEntities = 0;\n  let updatedActiveRecords = 0;\n  let updatedDeletedLog = 0;\n\n  for (const [entityId, entity] of Object.entries(entities)) {\n    const repoPath = entity.currentPath;\n    if (!repoPath) {\n      continue;\n    }\n\n    const revision = await getFileRevisionFromHistory(cwd, repoPath);\n    if (revision === entity.revision) {\n      continue;\n    }\n\n    entity.revision = revision;\n    updatedEntities += 1;\n\n    const deletedItem = deletedByEntityId.get(entityId);\n    if (deletedItem) {\n      deletedItem.lastRevision = revision;\n      updatedDeletedLog += 1;\n    }\n\n    if (entity.status !== \"active\" || paths[repoPath] !== entityId) {\n      continue;\n    }\n\n    const repoDir = path.posix.dirname(repoPath);\n    const fileName = getManifestFileName(repoPath);\n    let manifest = manifestCache.get(repoDir);\n    if (manifest === undefined) {\n      manifest = await loadDirectoryManifest(cwd, repoDir);\n      manifestCache.set(repoDir, manifest);\n    }\n    if (!manifest) {\n      continue;\n    }\n\n    upsertManifestRecord(manifest, fileName, {\n      entityId,\n      createdAt: entity.createdAt,\n      updatedAt: entity.updatedAt,\n      revision: entity.revision,\n      contentHash: entity.contentHash,\n      gitSha: entity.gitSha,\n      status: entity.status,\n    });\n    updatedActiveRecords += 1;\n  }\n\n  await saveEntitiesById(cwd, entities);\n  await Promise.all(\n    Array.from(manifestCache.values())\n      .filter((manifest): manifest is NonNullable<"+"typeof manifest> => Boolean(manifest))\n      .map((manifest) => saveDirectoryManifest(cwd, manifest)),\n  );\n\n  if (updatedDeletedLog > 0) {\n    await writeJsonFile(deletedLogPath(cwd), deletedLog);\n  }\n\n  console.log(\"\");\n  console.log(\"Integrity revision backfill\");\n  console.log(`  updated entities      ${updatedEntities}`);\n  console.log(`  updated manifest rows ${updatedActiveRecords}`);\n  console.log(`  updated deleted log   ${updatedDeletedLog}`);\n}\n"},"src/integrity/run-init.ts":{"language":"typescript","mutants":[{"id":"783","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":2,"line":102},"start":{"column":69,"line":38}}},{"id":"784","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":4,"line": <"+"void> {\n  const { cwd } = args;\n  await ensurePolicyFile(cwd);\n\n  const files = await discoverManagedFiles(cwd);\n  const grouped = await groupFilesByDirectory(files);\n  const manifests = new Map<"+"string, DirectoryManifest>();\n  const entities: EntitiesById = {};\n  const paths: PathsCurrent = {};\n\n  for (const file of files) {\n    const absPath = path.join(cwd, file);\n    const entityId = uuidv7();\n    const hash = await byteHashFile(absPath);\n    const [history, revision] = await Promise.all([\n      getFileHistory(cwd, file),\n      getFileRevisionFromHistory(cwd, file),\n    ]);\n    const now = new Date().toISOString();\n\n    const record = {\n      entityId,\n      createdAt: history.createdAt ?? now,\n      updatedAt: history.updatedAt ?? now,\n      revision,\n      contentHash: hash,\n      gitSha: history.lastCommitSha ?? \"unknown\",\n      status: \"active\" as const,\n    };\n\n    const repoDir = path.posix.dirname(file);\n    const fileName = getManifestFileName(file);\n    const manifest = manifests.get(repoDir) ?? createEmptyManifest(repoDir);\n    upsertManifestRecord(manifest, fileName, record);\n    manifests.set(repoDir, manifest);\n\n    entities[entityId] = {\n      currentPath: file,\n      firstPath: file,\n      createdAt: record.createdAt,\n      updatedAt: record.updatedAt,\n      revision: record.revision,\n      contentHash: record.contentHash,\n      gitSha: record.gitSha,\n      status: \"active\",\n      moves: [],\n    };\n    paths[file] = entityId;\n  }\n\n  for (const repoDir of grouped.keys()) {\n    const manifest = manifests.get(repoDir);\n    if (manifest) await saveDirectoryManifest(cwd, manifest);\n  }\n\n  await saveEntitiesById(cwd, entities);\n  await savePathsCurrent(cwd, paths);\n  await writeJsonFile(deletedLogPath(cwd), []);\n\n  console.log(\"\");\n  console.log(\"Integrity init\");\n  console.log(`  managed files       ${files.length}`);\n  console.log(`  managed directories ${grouped.size}`);\n th);\n  const fileName = getManifestFileName(repoPath);\n  const manifest = await manifestStore.get(repoDir);\n  upsertManifestRecord(manifest, fileName, entityToManifestRecord(entityId, entities[entityId]));\n}\n\nasync function updateModifiedEntity(args: {\n  cwd: string;\n  entities: EntitiesById;\n  paths: PathsCurrent;\n  manifestStore: ReturnType<"+"typeof createManifestStore>;\n  repoPath: string;\n}): Promise<"+"void> {\n  const { cwd, entities, paths, manifestStore, repoPath } = args;\n  const entityId = paths[repoPath];\n  if (!entityId) return;\n  const entity = entities[entityId];\n  if (!entity || entity.status !== \"active\") return;\n\n  const absPath = path.join(cwd, repoPath);\n  const nextHash = await byteHashFile(absPath);\n  if (nextHash === entity.contentHash) return;\n\n  const history = await getFileHistory(cwd, repoPath);\n  entity.contentHash = nextHash;\n  entity.updatedAt = history.updatedAt ?? new Date().toISOString();\n  entity.gitSha = history.lastCommitSha ?? entity.gitSha;\n  entity.revision += 1;\n\n  const repoDir = path.posix.dirname(repoPath);\n  const fileName = getManifestFileName(repoPath);\n  const manifest = await manifestStore.get(repoDir);\n  upsertManifestRecord(manifest, fileName, entityToManifestRecord(entityId, entity));\n}\n\nexport async function runUpdate(args: { cwd: string; baseRef?: string }): Promise<"+"void> {\n  const { cwd, baseRef } = args;\n  const entities = await loadEntitiesById(cwd);\n  const paths = await loadPathsCurrent(cwd);\n  const deletedLog = await loadDeletedLog(cwd);\n  const manifestStore = createManifestStore(cwd);\n\n  const currentManagedFiles = await discoverManagedFiles(cwd);\n  const currentManagedSet = new Set(currentManagedFiles);\n  const changes = await getChangedPaths(cwd, baseRef);\n  const outOfSyncActivePaths = await findOutOfSyncActivePaths({\n    cwd,\n    entities,\n    paths,\n    currentManagedFiles,\n  });\n\n  const activePaths = Object.entries(paths)\n    .filter(([, enti   (data: unknown): boolean;\n  errors?: Array<"+"{ instancePath?: string; message?: string }> | null;\n};\n\ninterface AjvLike {\n  compile(schema: object): AjvValidateFunction;\n}\n\ninterface LoadedAjv {\n  ajv: AjvLike;\n  addFormats: (ajv: AjvLike) => void;\n}\n\ninterface SchemaTarget {\n  schemaFile: string;\n  dataFile: string;\n  pathLabel: string;\n  optional?: boolean;\n}\n\nfunction formatAjvErrors(\n  errors: Array<"+"{ instancePath?: string; message?: string }> | null | undefined,\n): string {\n  if (!errors?.length) return \"schema validation failed\";\n  return errors\n    .map((error) => `${error.instancePath || \"/\"} ${error.message ?? \"is invalid\"}`.trim())\n    .join(\"; \");\n}\n\nasync function tryLoadAjv(): Promise<"+"LoadedAjv | null> {\n  try {\n    const [{ default: Ajv2020 }, addFormatsModule] = await Promise.all([\n      import(\"ajv/dist/2020.js\"),\n      import(\"ajv-formats\"),\n    ]);\n\n    const ajv = new Ajv2020({ allErrors: true, strict: false }) as AjvLike;\n    const addFormats = (addFormatsModule.default ?? addFormatsModule) as unknown as (\n      ajv: AjvLike,\n    ) => void;\n    addFormats(ajv);\n\n    return { ajv, addFormats };\n  } catch {\n    return null;\n  }\n}\n\nasync function loadValidator(\n  ajv: AjvLike,\n  root: string,\n  schemaFile: string,\n): Promise<"+"AjvValidateFunction> {\n  const schema = await readJsonFile<"+"object>(`${root}/${schemaFile}`);\n  return ajv.compile(schema);\n}\n\nexport async function validateIntegrityJsonSchemas(cwd: string): Promise<"+"VerifyIssue[]> {\n  const issues: VerifyIssue[] = [];\n  const root = schemaDir(cwd);\n  const loadedAjv = await tryLoadAjv();\n\n  if (!loadedAjv) {\n    issues.push({\n      level: \"warning\",\n      code: \"SCHEMA_VALIDATION_SKIPPED\",\n      message:\n        \"Ajv is not installed, so Draft 2020-12 schema validation was skipped. Structural verification is still active.\",\n      path: \".integrity/schema\",\n    });\n    return issues;\n  }\n\n  const { ajv } = loadedAjv;\n\n  const validatorFiles = [\n    \"policy.schema.json\",\n    \"entities.by-id.schema.json\",\n    \"paths.current.schema.json\",\n    \"deleted-log.schema.json\",\n    \"manifest.schema.json\",\n    \"outputs.schema.json\",\n    \"build-provenance.schema.json\",\n  ];\n\n  const validators = new Map<"+"string, AjvValidateFunction>();\n  for (const schemaFile of validatorFiles) {\n    validators.set(schemaFile, await loadValidator(ajv, root, schemaFile));\n  }\n\n  const targets: SchemaTarget[] = [\n    {\n      schemaFile: \"policy.schema.json\",\n      dataFile: policyPath(cwd),\n      pathLabel: \".integrity/config/policy.json\",\n    },\n    {\n      schemaFile: \"entities.by-id.schema.json\",\n      dataFile: entitiesByIdPath(cwd),\n      pathLabel: \".integrity/index/entities.by-id.json\",\n    },\n    {\n      schemaFile: \"paths.current.schema.json\",\n      dataFile: currentPathsPath(cwd),\n      pathLabel: \".integrity/index/paths.current.json\",\n    },\n    {\n      schemaFile: \"deleted-log.schema.json\",\n      dataFile: deletedLogPath(cwd),\n      pathLabel: \".integrity/state/deleted-log.json\",\n    },\n    {\n      schemaFile: \"outputs.schema.json\",\n      dataFile: outputsPath(cwd),\n      pathLabel: \".integrity/build/latest/outputs.json\",\n      optional: true,\n    },\n    {\n      schemaFile: \"build-provenance.schema.json\",\n      dataFile: provenancePath(cwd),\n      pathLabel: \".integrity/build/latest/build-provenance.json\",\n      optional: true,\n    },\n  ];\n\n  const managedDirs = await discoverManagedDirectories(cwd).catch(() => []);\n  for (const repoDir of managedDirs) {\n    targets.push({\n      schemaFile: \"manifest.schema.json\",\n      dataFile: manifestPathForDirectory(cwd, repoDir),\n      pathLabel: `.integrity/manifests/${repoDir === \".\" ? \"root\" : repoDir}/versions.json`,\n    });\n  }\n\n  for (const target of targets) {\n    const exists = await pathExists(target.dataFile);\n    if (!exists) {\n      if (target.optional) {\n        continue;\n      }\n      issues.push({\n        level: \"error\",\n        code: \"SCHEMA_TARGET_MISSING\",\n        message: \"Required integrity JSON file is missing\",\n        path: target.pathLabel,\n      });\n      continue;\n    }\n\n    let data: unknown;\n    try {\n      data = await readJsonFile<"+"unknown>(target.dataFile);\n    } catch (error) {\n      issues.push({\n        level: \"error\",\n        code: \"INVALID_JSON\",\n        message: `Failed to parse JSON: ${error instanceof Error ? error.message : String(error)}`,\n        path: target.pathLabel,\n      });\n      continue;\n    }\n\n    const validator = validators.get(target.schemaFile);\n    if (!validator) {\n      issues.push({\n        level: \"error\",\n        code: \"SCHEMA_VALIDATOR_MISSING\",\n        message: `Missing validator for ${target.schemaFile}`,\n        path: target.pathLabel,\n      });\n      continue;\n    }\n\n    if (!validator(data)) {\n      issues.push({\n        level: \"error\",\n        code: \"SCHEMA_VALIDATION_FAILED\",\n        message: formatAjvErrors(validator.errors),\n        path: target.pathLabel,\n      });\n    }\n  }\n\n  const buildDirExists = await pathExists(buildLatestDir(cwd));\n  if (buildDirExists) {\n    const hasOutputs = await pathExists(outputsPath(cwd));\n    const hasProvenance = await pathExists(provenancePath(cwd));\n    if (hasOutputs !== hasProvenance) {\n      issues.push({\n        level: \"error\",\n        code: \"INCOMPLETE_BUILD_LAYER\",\n        message:\n          \"Build layer is incomplete: outputs.json and build-provenance.json must exist together\",\n        path: \".integrity/build/latest\",\n      });\n    }\n  }\n\n  return issues;\n}\n"},"src/integrity/signing.ts":{"language":"typescript","mutants":[{"id":"1198","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":2,"line":69},"start" rated sha256StringHex from deleted ./hash.ts to byteHash from @warpgogol/fingerprint directly.<"+"/item>\n  <"+"item>RFC-0921: delegate signing/verification/keygen to shared signing core. Remove node:crypto sign/verify imports and canonicalJson function.<"+"/item>\n  <"+"item>RFC-0931: add signBuildIdentity, writeReleasePublicKey, verifyBuildIdentitySignature for Ed25519 signing of build-identity.json in deploy pipeline.<"+"/item>\n<"+"/CHANGE_SUMMARY>\n\n/**\n * Ed25519 cryptographic signing for build artifacts.\n * Provides key generation, payload signing, signature verification, and manifest handling.\n */\n\nimport path from \"node:path\";\nimport { byteHash } from \"@warpgogol/werkstatt-engine/fingerprint\";\nimport {\n  generateKeyPair as signingGenerateKeyPair,\n  toPem as signingToPem,\n  toHex as signingToHex,\n  getPublicKey as signingGetPublicKey,\n  privateKeyPemToBytes,\n  publicKeyPemToBytes,\n  sign as signingSign,\n  verify as signingVerify,\n  canonicalBytes as signingCanonicalBytes,\n  fromHex as signingFromHex,\n} from \"@warpgogol/werkstatt-engine/signing\";\nimport { atomicWriteFile } from \"../werkstatt/atomic.ts\";\nimport { ensureDir, pathExists, readBuffer, readText, writeText } from \"./fs.ts\";\nimport { readJsonFile, stableStringify } from \"./json.ts\";\nimport {\n  buildLatestDir,\n  outputsPath,\n  provenancePath,\n  signedManifestPath,\n  signatureBinaryPath,\n  signatureHexPath,\n} from \"./paths.ts\";\nimport type { BuildProvenance, OutputsFile, SignablePayload, SignedManifest } from \"./types.ts\";\n\nlet dotEnvLoadedForCwd: string | undefined;\n\nexport interface SigningKeyPairPem {\n  privateKeyPem: string;\n  publicKeyPem: string;\n}\n\nexport interface ReleaseSignatureArtifacts {\n  outputs: OutputsFile;\n  provenance: BuildProvenance;\n  payload: SignablePayload;\n  payloadBytes: Buffer;\n  signatureBuffer: Buffer;\n  signatureHex: string;\n  signedManifest: SignedManifest;\n  reusedExistingSignature: boolean;\n}\n\nfunction p gine/fingerprint\";\nimport { discoverManagedDirectories, discoverManagedFiles } from \"./discover.ts\";\nimport { pathExists } from \"./fs.ts\";\nimport { getManifestFileName, loadDirectoryManifest } from \"./manifests.ts\";\nimport { loadEntitiesById, loadPathsCurrent } from \"./registry.ts\";\nimport { validateIntegrityJsonSchemas } from \"./schema-validation.ts\";\nimport type {\n  DirectoryManifest,\n  ManifestFileRecord,\n  RegistryEntity,\n  VerifyIssue,\n  VerifyReport,\n  VerifyStats,\n} from \"./types.ts\";\n\nfunction isIsoDateTime(value: string): boolean {\n  if (!value) return false;\n  return !Number.isNaN(Date.parse(value));\n}\n\nfunction isHexSha256(value: string): boolean {\n  return /^sha256:[0-9a-f]{64}$/i.test(value);\n}\n\nfunction pushIssue(\n  issues: VerifyIssue[],\n  level: \"error\" | \"warning\",\n  code: string,\n  message: string,\n  extras: Pick<"+"VerifyIssue, \"path\" | \"entityId\"> = {},\n): void {\n  issues.push({ level, code, message, ...extras });\n}\n\nfunction validateRecordShape(\n  issues: VerifyIssue[],\n  scope: \"manifest\" | \"registry\",\n  record: ManifestFileRecord | RegistryEntity,\n  filePath: string,\n  entityId?: string,\n): void {\n  if (!isIsoDateTime(record.createdAt)) {\n    pushIssue(issues, \"error\", \"INVALID_CREATED_AT\", `${scope} has invalid createdAt`, {\n      path: filePath,\n      entityId,\n    });\n  }\n  if (!isIsoDateTime(record.updatedAt)) {\n    pushIssue(issues, \"error\", \"INVALID_UPDATED_AT\", `${scope} has invalid updatedAt`, {\n      path: filePath,\n      entityId,\n    });\n  }\n  if (\n    isIsoDateTime(record.createdAt) &&\n    isIsoDateTime(record.updatedAt) &&\n    record.createdAt > record.updatedAt\n  ) {\n    pushIssue(\n      issues,\n      \"error\",\n      \"INVALID_TIMESTAMP_ORDER\",\n      `${scope} createdAt is greater than updatedAt`,\n      { path: filePath, entityId },\n    );\n  }\n  if (!Number.isInteger(record.revision) || record.revision <"+" 1) {\n    pushIssue(issues, \"error\", \"INVALID_REVISION\", `${scope} revision must be an integer >= 1`, {\n      path: filePath,\n      entityId,\n    });\n  }\n  if (!isHexSha256(record.contentHash)) {\n    pushIssue(\n      issues,\n      \"error\",\n      \"INVALID_CONTENT_HASH\",\n      `${scope} contentHash must match sha256:<"+"64-hex>`,\n      { path: filePath, entityId },\n    );\n  }\n  if (!record.gitSha || record.gitSha.length <"+" 7) {\n    pushIssue(issues, \"warning\", \"WEAK_GIT_SHA\", `${scope} gitSha looks missing or too short`, {\n      path: filePath,\n      entityId,\n    });\n  }\n}\n\nfunction compareManifestAndRegistry(\n  issues: VerifyIssue[],\n  repoPath: string,\n  manifestRecord: ManifestFileRecord,\n  registryRecord: RegistryEntity,\n): void {\n  const entityId = manifestRecord.entityId;\n\n  if (registryRecord.status !== \"active\") {\n    pushIssue(\n      issues,\n      \"error\",\n      \"REGISTRY_ENTITY_NOT_ACTIVE\",\n      \"Registry entity for managed file is not active\",\n      { path: repoPath, entityId },\n    );\n  }\n  if (registryRecord.currentPath !== repoPath) {\n    pushIssue(\n      issues,\n      \"error\",\n      \"CURRENT_PATH_MISMATCH\",\n      \"Registry currentPath does not match managed file path\",\n      { path: repoPath, entityId },\n    );\n  }\n  if (manifestRecord.status !== \"active\") {\n    pushIssue(\n      issues,\n      \"error\",\n      \"MANIFEST_RECORD_NOT_ACTIVE\",\n      \"Manifest record for managed file is not active\",\n      { path: repoPath, entityId },\n    );\n  }\n  if (manifestRecord.createdAt !== registryRecord.createdAt) {\n    pushIssue(issues, \"error\", \"CREATED_AT_MISMATCH\", \"Manifest and registry createdAt differ\", {\n      path: repoPath,\n      entityId,\n    });\n  }\n  if (manifestRecord.updatedAt !== registryRecord.updatedAt) {\n    pushIssue(issues, \"error\", \"UPDATED_AT_MISMATCH\", \"Manifest and registry updatedAt differ\", {\n      path: repoPath,\n      entityId,\n    });\n  }\n  if (manifestRecord.revision !== registryRecord.revision) {\n    pushIssue(issues, \"error\", \"REVISION_MISMATCH\", \"Manifest and registry revision differ\", {\n      path: repoPath,\n      entityId,\n    });\n  }\n  if (manifestRecord.contentHash !== registryRecord.contentHash) {\n    pushIssue(\n      issues,\n      \"error\",\n      \"CONTENT_HASH_MISMATCH_BETWEEN_INDEXES\",\n      \"Manifest and registry contentHash differ\",\n      { path: repoPath, entityId },\n    );\n  }\n  if (manifestRecord.gitSha !== registryRecord.gitSha) {\n    pushIssue(\n      issues,\n      \"warning\",\n      \"GIT_SHA_MISMATCH_BETWEEN_INDEXES\",\n      \"Manifest and registry gitSha differ\",\n      { path: repoPath, entityId },\n    );\n  }\n}\n\nasync function loadExpectedManifests(\n  cwd: string,\n  managedDirectories: string[],\n  issues: VerifyIssue[],\n): Promise<"+"Map<"+"string, DirectoryManifest>> {\n  const manifests = new Map<"+"string, DirectoryManifest>();\n\n  for (const repoDir of managedDirectories) {\n    const manifest = await loadDirectoryManifest(cwd, repoDir);\n    if (!manifest) {\n      pushIssue(\n        issues,\n        \"error\",\n        \"MISSING_DIRECTORY_MANIFEST\",\n        \"Managed directory is missing versions.json\",\n        { path: repoDir },\n      );\n      continue;\n    }\n    manifests.set(repoDir, manifest);\n\n    if (manifest.$schemaVersion !== 1) {\n      pushIssue(\n        issues,\n        \"error\",\n        \"INVALID_MANIFEST_SCHEMA_VERSION\",\n        \"Manifest has unsupported $schemaVersion\",\n        { path: repoDir },\n      );\n    }\n    if (manifest.directory !== repoDir) {\n      pushIssue(\n        issues,\n        \"error\",\n        \"MANIFEST_DIRECTORY_MISMATCH\",\n        \"Manifest directory field does not match directory path\",\n        { path: repoDir },\n      );\n    }\n    if (!isIsoDateTime(manifest.generatedAt)) {\n      pushIssue(\n        issues,\n        \"error\",\n        \"INVALID_MANIFEST_GENERATED_AT\",\n        \"Manifest generatedAt is invalid\",\n        { path: repoDir },\n      );\n    }\n  }\n\n  return manifests;\n}\n\nexport async function verifyIntegrity(cwd: string): Promise<"+"VerifyReport> {\n  const issues: VerifyIssue[] = [];\n  issues.push(...(await validateIntegrityJsonSchemas(cwd)));\n  const managedFiles = await discoverManagedFiles(cwd);\n  const managedDirectories = await discoverManagedDirectories(cwd);\n  const entities = await loadEntitiesById(cwd);\n  const paths = await loadPathsCurrent(cwd);\n  const manifests = await loadExpectedManifests(cwd, managedDirectories, issues);\n\n  const activeEntities = Object.entries(entities).filter(\n    ([, entity]) => entity.status === \"active\",\n  );\n  const duplicateEntityIds = new Set<"+"string>();\n  const seenEntityIds = new Set<"+"string>();\n\n  for (const [repoPath, entityId] of Object.entries(paths)) {\n    if (!managedFiles.includes(repoPath)) {\n      const exists = await pathExists(path.join(cwd, repoPath));\n      pushIssue(\n        issues,\n        exists ? \"warning\" : \"error\",\n        \"UNEXPECTED_PATH_BINDING\",\n        exists\n          ? \"paths.current contains a binding for a file outside managed scope\"\n          : \"paths.current contains a binding for a missing file\",\n        { path: repoPath, entityId },\n      );\n    }\n    if (seenEntityIds.has(entityId)) {\n      duplicateEntityIds.add(entityId);\n    }\n    seenEntityIds.add(entityId);\n  }\n\n  for (const entityId of duplicateEntityIds) {\n    pushIssue(\n      issues,\n      \"error\",\n      \"DUPLICATE_ACTIVE_ENTITY_ID\",\n      \"The same entityId is bound to multiple current paths\",\n      { entityId },\n    );\n  }\n\n  for (const file of managedFiles) {\n    const entityId = paths[file];\n    const absPath = path.join(cwd, file);\n    const repoDir = path.posix.dirname(file);\n    const fileName = getManifestFileName(file);\n    const manifest = manifests.get(repoDir);\n\n    if (!entityId) {\n      pushIssue(\n        issues,\n        \"error\",\n        \"MISSING_PATH_BINDING\",\n        \"Managed file is missing from paths.current index\",\n        { path: file },\n      );\n      continue;\n    }\n\n    const entity = entities[entityId];\n    if (!entity) {\n      pushIssue(\n        issues,\n        \"error\",\n        \"MISSING_REGISTRY_ENTITY\",\n        \"Path binding points to absent registry entity\",\n        { path: file, entityId },\n      );\n      continue;\n    }\n\n    validateRecordShape(issues, \"registry\", entity, file, entityId);\n\n    if (!manifest) continue;\n\n    const manifestRecord = manifest.files[fileName];\n    if (!manifestRecord) {\n      pushIssue(\n        issues,\n        \"error\",\n        \"MISSING_MANIFEST_RECORD\",\n        \"Managed file is missing from its directory manifest\",\n        { path: file, entityId },\n      );\n      continue;\n    }\n\n    validateRecordShape(issues, \"manifest\", manifestRecord, file, entityId);\n\n    if (manifestRecord.entityId !== entityId) {\n      pushIssue(\n        issues,\n        \"error\",\n        \"ENTITY_ID_MISMATCH\",\n        \"Manifest record entityId differs from paths.current binding\",\n        { path: file, entityId },\n      );\n    }\n\n    compareManifestAndRegistry(issues, file, manifestRecord, entity);\n\n    const actualHash = await byteHashFile(absPath);\n    if (actualHash !== entity.contentHash) {\n      pushIssue(\n        issues,\n        \"error\",\n        \"HASH_MISMATCH_REGISTRY\",\n        \"Actual file hash differs from registry hash\",\n        { path: file, entityId },\n      );\n    }\n    if (actualHash !== manifestRecord.contentHash) {\n      pushIssue(\n        issues,\n        \"error\",\n        \"HASH_MISMATCH_MANIFEST\",\n        \"Actual file hash differs from manifest hash\",\n        { path: file, entityId },\n      );\n    }\n  }\n\n  for (const [repoDir, manifest] of manifests) {\n    for (const [fileName, manifestRecord] of Object.entries(manifest.files)) {\n      const repoPath = path.posix.join(repoDir, fileName);\n      const entity = entities[manifestRecord.entityId];\n      const hasFile = managedFiles.includes(repoPath);\n\n      validateRecordShape(issues, \"manifest\", manifestRecord, repoPath, manifestRecord.entityId);\n\n      if (!hasFile) {\n        const exists = await pathExists(path.join(cwd, repoPath));\n        pushIssue(\n          issues,\n          exists ? \"warning\" : \"error\",\n          \"STALE_MANIFEST_RECORD\",\n          exists\n            ? \"Manifest record points to an existing file outside managed scope\"\n            : \"Manifest record points to a missing file\",\n          { path: repoPath, entityId: manifestRecord.entityId },\n        );\n      }\n\n      if (!entity) {\n        pushIssue(\n          issues,\n          \"error\",\n          \"MANIFEST_ENTITY_MISSING_IN_REGISTRY\",\n          \"Manifest record points to missing registry entity\",\n          { path: repoPath, entityId: manifestRecord.entityId },\n        );\n      }\n    }\n  }\n\n  for (const [entityId, entity] of activeEntities) {\n    validateRecordShape(issues, \"registry\", entity, entity.currentPath, entityId);\n\n    if (!managedFiles.includes(entity.currentPath)) {\n      const exists = await pathExists(path.join(cwd, entity.currentPath));\n      pushIssue(\n        issues,\n        exists ? \"warning\" : \"error\",\n        \"ACTIVE_ENTITY_OUTSIDE_SCOPE\",\n        exists\n          ? \"Active registry entity points to a file outside managed scope\"\n          : \"Active registry entity points to a missing file\",\n        { path: entity.currentPath, entityId },\n      );\n    }\n\n    if (paths[entity.currentPath] !== entityId) {\n      pushIssue(\n        issues,\n        \"error\",\n        \"REGISTRY_PATH_NOT_BOUND\",\n        \"Active registry entity currentPath is not correctly bound in paths.current\",\n        { path: entity.currentPath, entityId },\n      );\n    }\n  }\n\n  const collator = new Intl.Collator(\"en\");\n  issues.sort((a, b) => {\n    if (a.level !== b.level) return a.level === \"error\" ? -1 : 1;\n    if ((a.code ?? \"\") !== (b.code ?? \"\")) return collator.compare(a.code ?? \"\", b.code ?? \"\");\n    if ((a.path ?? \"\") !== (b.path ?? \"\")) return collator.compare(a.path ?? \"\", b.path ?? \"\");\n    return collator.compare(a.entityId ?? \"\", b.entityId ?? \"\");\n  });\n\n  const stats: VerifyStats = {\n    managedFiles: managedFiles.length,\n    managedDirectories: managedDirectories.length,\n    manifestsLoaded: manifests.size,\n    activeEntities: activeEntities.length,\n    activePathBindings: Object.keys(paths).length,\n    errors: issues.filter((issue) => issue.level === \"error\").length,\n    warnings: issues.filter((issue) => issue.level === \"warning\").length,\n  };\n\n  return { ok: stats.errors === 0, issues, stats };\n}\n"},"src/integrity/module.ts":{"language":"typescript","mutants":[{"id":"555","mutatorName":"ObjectLiteral","replacement":"{}","statusReason":"ENOENT: no such file or directory, open '/tmp/systems-cache/test-sys/system-state.yaml.tmp-975479-1788713649863'","status":"Killed","static":true,"testsCompleted":6,"killedBy":["23"],"coveredBy":[],"location":{"end":{"column":32,"line":21},"start":{"column":3,"line":21}}},{"id":"552","mutatorName":"ArrayDeclaration","replacement":"[]","statusReason":"ENOENT: no such file or directory, open '/tmp/systems-cache/test-sys/system-state.yaml'","status":"Killed","static":true,"testsCompleted":5,"killedBy":["22"],"coveredBy":[],"location":{"end":{"column":2,"line":23},"start":{"column":66,"line":19}}},{"id":"553","mutatorName":"ObjectLiteral","replacement":"{}","statusReason":"ENOENT: no such file or directory, rename '/tmp/systems-cache/test-sys/system-state.yaml.tmp-974905-1788713650015' -> '/tmp/systems-cache/test-sys/system-state.yaml'","status":"Killed","static":true,"testsCompleted":6,"killedBy":["23"],"coveredBy":[],"location":{"end":{"column":40,"line":20},"start":{"column":3,"line":20}}},{"id":"556","mutatorName":"StringLiteral","replacement":"\"\"","status":"Survived","static":true,"testsCompleted":56,"coveredBy":[],"location":{"end":{"column":30,"line":21},"start":{"column":14,"line":21}}},{"id":"557","mutatorName":"ObjectLiteral","replacement":"{}","status":"Survived","static":true,"testsCompleted":56,"coveredBy":[],"location":{"end":{"column":42,"line":22},"start":{"column":3,"line":22}}},{"id":"558","mutatorName":"StringLiteral","replacement":"\"\"","status":"Survived","static":true,"testsCompleted":56,"coveredBy":[],"location":{"end":{"column":40,"line":22},"start":{"column":14,"line":22}}},{"id":"554","mutatorName":"StringLiteral","replacement":"\"\"","status":"Survived","static":true,"testsCompleted":56,"coveredBy":[],"location":{"end":{"column":38,"line":20},"start":{"column":14,"line":20}}}],"source":"/*\n<"+"MODULE_CONTRACT>\n<"+"purpose>Defines a constant sequence for integrity operations in release processes.<"+"/purpose>\n<"+"non-goals>\n  <"+"item>Do not define the implementation details of each command.<"+"/item>\n  <"+"item>Do not manage the execution context or orchestration of the pipeline.<"+"/item>\n<"+"/non-goals>\n<"+"/MODULE_CONTRACT>\n<"+"CHANGE_SUMMARY>\n  <"+"item>Clarify module purpose and responsibilities for future reference.<"+"/item>\n<"+"/CHANGE_SUMMARY>\n*/\n\nimport type { KernelPipelineStep } from \"@warpgogol/werkstatt-engine/kernel\";\n\n// @ai-invariant STANDARD_INTEGRITY_PIPELINE is the single authoritative ordered sequence for\n// integrity release operations. Apps spread this constant into their pipelines to get\n// the full workflow: build record → sign → verify release.\nexport const STANDARD_INTEGRITY_PIPELINE: KernelPipelineStep[] = [\n  { command: \"integrity.build-record\" },\n  { command: \"integrity.sign\" },\n  { command: \"integrity.verify-release\" },\n];\n"}},"schemaVersion":"1.0","thresholds":{"high":80,"low":60,"break":50},"testFiles":{"src/tests-handoff/leitstand-0995-mirror-sync-pre-flight.test.ts":{"tests":[{"id":"0","name":"warns when external mirrors are out of sync (originSha !== mirrorSha)"},{"id":"1","name":"warns when mirror ref not found"},{"id":"2","name":"no warning when mirrors are in sync (originSha === mirrorSha)"},{"id":"3","name":"no warning and no error when no external mirrors configured (mirrors.length <"+"= 2)"},{"id":"4","name":"silently skips when system config not found"},{"id":"5","name":"silently skips when bare repo does not exist"}],"source":"/*\n<"+"MODULE_CONTRACT>\n  <"+"purpose>\n    RFC-0995: unit tests for mirror sync pre-flight check in leitstand.promote —\n    verifies warning is logged when external mirrors are out of sync, when mirror\n    ref is missing, and that no warning is logged when mirrors are in sync or\n    when no external mirrors are configured.\n  <"+"/purpose>\n  <"+"keywords>RFC-0995, leitstand, promote, mirror, sync, pre-flight, warning<"+"/keywords>\n<"+"/MODULE_CONTRACT>\n<"+"CHANGE_SUMMARY>\n  <"+"item>RFC-0995: initial tests for checkMirrorSyncPreFlight pure function.<"+"/item>\n<"+"/CHANGE_SUMMARY>\n*/\n\nimport { test, expect, beforeEach, afterEach } from \"vitest\";\nimport { mkdtempSync, rmSync, mkdirSync, writeFileSync } from \"node:fs\";\nimport { join } from \"node:path\";\nimport { execSync } from \"node:child_process\";\nimport { tmpdir } from \"node:os\";\nimport { checkMirrorSyncPreFlight } from \"../leitstand/leitstand-commands.ts\";\n\nlet testRoot: string;\nlet workspaceRoot: string;\n\nbeforeEach(() => {\n  testRoot = mkdtempSync(join(tmpdir(), \"tmp-rfc-0995-\"));\n  workspaceRoot = join(testRoot, \"workspace\");\n  mkdirSync(workspaceRoot, { recursive: true });\n});\n\nafterEach(() => {\n  rmSync(testRoot, { recursive: true, force: true });\n});\n\nfunction makeBareRepo(barePath: string): void {\n  mkdirSync(barePath, { recursive: true });\n  execSync(\"git init --bare -b main\", { cwd: barePath, stdio: \"pipe\" });\n}\n\nfunction commitToBare(barePath: string, msg: string): string {\n  const tmpClone = join(testRoot, \"tmp-clone-\" + Date.now());\n  execSync(`git clone \"${barePath}\" \"${tmpClone}\"`, { stdio: \"pipe\" });\n  execSync(\"git config user.email test@test.com\", { cwd: tmpClone, stdio: \"pipe\" });\n  execSync(\"git config user.name Test\", { cwd: tmpClone, stdio: \"pipe\" });\n  writeFileSync(join(tmpClone, \"README.md\"), `# ${msg}\\n`);\n  execSync(\"git add -A\", { cwd: tmpClone, stdio: \"pipe\" });\n  execSync(`git commit -m ${JSON.stringify(msg)}`, { cwd: tmpClone, stdio: \"pipe\" });\n  execSync(\"git push origin main\", { cwd: tmpClone, stdio: \"pipe\" });\n  const sha = execSync(\"git rev-parse HEAD\", { cwd: tmpClone, encoding: \"utf-8\" }).trim();\n  rmSync(tmpClone, { recursive: true, force: true });\n  return sha;\n}\n\nfunction writeSystemConfig(systemId: string, mirrors: Array<"+"{ path: string; storageType: string }>): void {\n  const cacheDir = join(testRoot, \"systems-cache\", systemId);\n  mkdirSync(cacheDir, { recursive: true });\n  const mirrorsYaml = mirrors.map((m) => `  - path: \"${m.path}\"\\n    storageType: ${m.storageType}`).join(\"\\n\");\n  const configContent = `schemaVersion: system-config/v1\nid: ${systemId}\ncosmicStar: Vega\nmirrors:\n${mirrorsYaml}\npinnedPlatform: \"6.0.0\"\nstatus: active\nregisteredAt: \"2026-01-01T00:00:00Z\"\nnotes: \"\"\n`;\n  writeFileSync(join(cacheDir, \"system-config.yaml\"), configContent);\n}\n\ntest(\"warns when external mirrors are out of sync (originSha !== mirrorSha)\", async () => {\n  const systemId = \"test-sys\";\n  const barePath = join(testRoot, \"systems-cache\", `${systemId}.git`);\n  makeBareRepo(barePath);\n\n  const sha1 = commitToBare(barePath, \"first commit\");\n  const sha2 = commitToBare(barePath, \"second commit\");\n\n  // Set refs/mirror/main to the first commit (stale)\n  execSync(`git update-ref refs/mirror/main ${sha1}`, { cwd: barePath, stdio: \"pipe\" });\n\n  writeSystemConfig(systemId, [\n    { path: `../systems-cache/${systemId}`, storageType: \"non-bare\" },\n    { path: `../systems-cache/${systemId}.git`, storageType: \"bare\" },\n    { path: \"https://github.com/example/repo.git\", storageType: \"bare\" },\n  ]);\n\n  const warnings: string[] = [];\n  const logger = { warn: (msg: string) => warnings.push(msg) };\n\n  await checkMirrorSyncPreFlight(workspaceRoot, systemId, logger);\n\n  expect(warnings).toHaveLength(1);\n  expect(warnings[0]).toContain(\"external mirrors are out of sync\");\n  expect(warnings[0]).toContain(`origin=${sha2.slice(0, 8)}`);\n  expect(warnings[0]).toContain(`mirror=${sha1.slice(0, 8)}`);\n  expect(warnings[0]).toContain(`sternsystem.sync --id ${systemId}`);\n});\n\ntest(\"warns when mirror ref not found\", async () => {\n  const systemId = \"test-sys\";\n  const barePath = join(testRoot, \"systems-cache\", `${systemId}.git`);\n  makeBareRepo(barePath);\n\n  commitToBare(barePath, \"first commit\");\n\n  // Do NOT set refs/mirror/main — simulates never-synced state\n\n  writeSystemConfig(systemId, [\n    { path: `../systems-cache/${systemId}`, storageType: \"non-bare\" },\n    { path: `../systems-cache/${systemId}.git`, storageType: \"bare\" },\n    { path: \"https://github.com/example/repo.git\", storageType: \"bare\" },\n  ]);\n\n  const warnings: string[] = [];\n  const logger = { warn: (msg: string) => warnings.push(msg) };\n\n  await checkMirrorSyncPreFlight(workspaceRoot, systemId, logger);\n\n  expect(warnings).toHaveLength(1);\n  expect(warnings[0]).toContain(\"mirror ref not found\");\n  expect(warnings[0]).toContain(`sternsystem.sync --id ${systemId}`);\n});\n\ntest(\"no warning when mirrors are in sync (originSha === mirrorSha)\", async () => {\n  const systemId = \"test-sys\";\n  const barePath = join(testRoot, \"systems-cache\", `${systemId}.git`);\n  makeBareRepo(barePath);\n\n  const sha = commitToBare(barePath, \"only commit\");\n\n  // Set refs/mirror/main to same SHA — mirrors in sync\n  execSync(`git update-ref refs/mirror/main ${sha}`, { cwd: barePath, stdio: \"pipe\" });\n\n  writeSystemConfig(systemId, [\n    { path: `../systems-cache/${systemId}`, storageType: \"non-bare\" },\n    { path: `../systems-cache/${systemId}.git`, storageType: \"bare\" },\n    { path: \"https://github.com/example/repo.git\", storageType: \"bare\" },\n  ]);\n\n  const warnings: string[] = [];\n  const logger = { warn: (msg: string) => warnings.push(msg) };\n\n  await checkMirrorSyncPreFlight(workspaceRoot, systemId, logger);\n\n  expect(warnings).toHaveLength(0);\n});\n\ntest(\"no warning and no error when no external mirrors configured (mirrors.length <"+"= 2)\", async () => {\n  const systemId = \"test-sys\";\n  const barePath = join(testRoot, \"systems-cache\", `${systemId}.git`);\n  makeBareRepo(barePath);\n\n  commitToBare(barePath, \"commit\");\n\n  writeSystemConfig(systemId, [\n    { path: `../systems-cache/${systemId}`, storageType: \"non-bare\" },\n    { path: `../systems-cache/${systemId}.git`, storageType: \"bare\" },\n  ]);\n\n  const warnings: string[] = [];\n  const logger = { warn: (msg: string) => warnings.push(msg) };\n\n  await checkMirrorSyncPreFlight(workspaceRoot, systemId, logger);\n\n  expect(warnings).toHaveLength(0);\n});\n\ntest(\"silently skips when system config not found\", async () => {\n  const systemId = \"nonexistent-sys\";\n  const warnings: string[] = [];\n  const logger = { warn: (msg: string) => warnings.push(msg) };\n\n  await expect(checkMirrorSyncPreFlight(workspaceRoot, systemId, logger)).resolves.toBeUndefined();\n  expect(warnings).toHaveLength(0);\n});\n\ntest(\"silently skips when bare repo does not exist\", async () => {\n  const systemId = \"test-sys\";\n  // No bare repo created\n\n  writeSystemConfig(systemId, [\n    { path: `../systems-cache/${systemId}`, storageType: \"non-bare\" },\n    { path: `../systems-cache/${systemId}.git`, storageType: \"bare\" },\n    { path: \"https://github.com/example/repo.git\", storageType: \"bare\" },\n  ]);\n\n  const warnings: string[] = [];\n  const logger = { warn: (msg: string) => warnings.push(msg) };\n\n  await checkMirrorSyncPreFlight(workspaceRoot, systemId, logger);\n\n  expect(warnings).toHaveLength(0);\n});\n"},"src/leitstand/tests/leitstand-sign.test.ts":{"tests":[{"id":"6","name":"RFC-0931: signBuildIdentity signs build-identity.json and embeds signature, publicKeyUrl, signedAt"},{"id":"7","name":"RFC-0931: signBuildIdentity reuses existing signature when payload hasn't changed (idempotency)"},{"id":"8","name":"RFC-0931: signBuildIdentity produces new signature when payload has changed"},{"id":"9","name":"RFC-0931: writeReleasePublicKey writes release-pubkey.json to dist/client/.well-known/"},{"id":"10","name":"RFC-0931: verifyBuildIdentitySignature verifies a valid signature"},{"id":"11","name":"RFC-0931: verifyBuildIdentitySignature rejects tampered build-identity.json"},{"id":"12","name":"RFC-0931: verifyBuildIdentitySignature returns false when no signature present"},{"id":"13","name":"RFC-0931: leitstand.verify --verify-signature signatureValid is null when --verify-signature is not set"},{"id":"14","name":"RFC-0931: leitstand.verify --verify-signature signatureValid is true when signature matches public key"},{"id":"15","name":"RFC-0931: leitstand.verify --verify-signature signatureValid is false when signature does not match (wrong key)"},{"id":"16","name":"RFC-0931: leitstand.verify --verify-signature signatureValid is null when release-pubkey.json is not found (404)"},{"id":"17","name":"RFC-0931: leitstand.verify --verify-signature signatureValid is null when build-identity.json has no signature field"}],"source":"/*\n<"+"MODULE_CONTRACT>\n  <"+"purpose>RFC-0931: unit tests for build-identity.json signing, release-pubkey.json writing, and signature verification.<"+"/purpose>\n<"+"/MODULE_CONTRACT>\n<"+"CHANGE_SUMMARY>\n  <"+"item>RFC-0931: initial tests for signBuildIdentity, writeReleasePublicKey, verifyBuildIdentitySignature, and leitstand.verify --verify-signature.<"+"/item>\n<"+"/CHANGE_SUMMARY>\n*/\n\nimport { describe, expect, it, vi, beforeEach, afterEach } from \"vitest\";\nimport { mkdtempSync, writeFileSync, readFileSync, existsSync } from \"node:fs\";\nimport { join } from \"node:path\";\nimport { tmpdir } from \"node:os\";\nimport {\n  signBuildIdentity,\n  writeReleasePublicKey,\n  verifyBuildIdentitySignature,\n} from \"../../integrity/signing.ts\";\nimport { generateKeyPair, toHex } from \"@warpgogol/werkstatt-engine/signing\";\n\nvi.mock(\"../../sternsystem/registry-io.ts\", () => ({\n  readSystemConfigSmart: vi.fn(),\n  readSystemStateSmart: vi.fn(),\n  resolveCacheClonePath: vi.fn(),\n}));\n\nconst { runLeitstandVerify } = await import(\"../leitstand-commands.ts\");\nconst { readSystemConfigSmart, readSystemStateSmart } =\n  await import(\"../../sternsystem/registry-io.ts\");\n\nfunction makeInput(flags: Record<"+"string, unknown>) {\n  return { flags, args: [] } as unknown as Parameters<"+"typeof runLeitstandVerify>[0];\n}\n\nfunction makeContext(workspaceRoot: string) {\n  return { workspaceRoot, dryRun: false, site: undefined } as unknown as Parameters<"+"\n    typeof runLeitstandVerify\n  >[1];\n}\n\nconst defaultConfig = {\n  schemaVersion: \"1.0.0\",\n  id: \"test-site\",\n  deployment: {\n    adapter: \"cloudflare-workers\" as const,\n    channels: {\n      dev: { workerName: \"dev-test\", url: \"https://dev.test.com\" },\n      alt: { workerName: \"alt-test\", url: \"https://alt.test.com\" },\n      main: { workerName: \"test\", url: \"https://test.com\" },\n    },\n  },\n};\n\nconst defaultState = {\n  schemaVersion: \"1.0.0\",\n  systemId: \"test-site\",\n  currentMission: null,\n  lastRelease: null,\n  lastPropagated: {\n    dev: {\n      releaseId: \"r000005\",\n      at: \"2026-08-23T12:00:00.000Z\",\n      healthy: true,\n      state: \"succeeded\" as const,\n      operationId: \"op-1\",\n      leaseExpiresAt: null,\n    },\n    alt: {\n      releaseId: \"r000005\",\n      at: \"2026-08-23T13:00:00.000Z\",\n      healthy: true,\n      state: \"succeeded\" as const,\n      operationId: \"op-2\",\n      leaseExpiresAt: null,\n    },\n    main: {\n      releaseId: \"r000005\",\n      at: \"2026-08-23T14:00:00.000Z\",\n      healthy: true,\n      state: \"succeeded\" as const,\n      operationId: \"op-3\",\n      leaseExpiresAt: null,\n    },\n  },\n  accessPin: null as string | null,\n};\n\nfunction mockBuildIdentity(distTreeHash: string, releaseId = \"r000005\") {\n  return JSON.stringify({\n    distTreeHash,\n    releaseId,\n    missionId: \"m000076\",\n    buildTimestamp: \"2026-08-23T12:45:06Z\",\n  });\n}\n\nlet tmpDir: string;\nlet keyPair: { privateKey: Uint8Array; publicKey: Uint8Array };\n\nbeforeEach(async () => {\n  tmpDir = mkdtempSync(join(tmpdir(), \"leitstand-sign-\"));\n  keyPair = await generateKeyPair();\n});\n\nafterEach(() => {\n  vi.restoreAllMocks();\n});\n\ndescribe(\"RFC-0931: signBuildIdentity\", () => {\n  it(\"signs build-identity.json and embeds signature, publicKeyUrl, signedAt\", async () => {\n    const idPath = join(tmpDir, \"build-identity.json\");\n    writeFileSync(\n      idPath,\n      JSON.stringify({\n        releaseId: \"test-r000001\",\n        systemId: \"test-site\",\n        missionId: \"m000001\",\n        semver: \"1.0.0\",\n        distTreeHash: \"sha256:abc\",\n        behaviorSnapshotHash: \"sha256:def\",\n        siteContentHash: \"sha256:ghi\",\n        platformVersion: \"6.0.0\",\n        platformSemanticHash: \"sha256:sem\",\n        commitSha: \"abc123\",\n        buildTimestamp: \"2026-08-23T12:00:00.000Z\",\n        targetPlatform: \"cloudflare\",\n      }),\n    );\n\n    const result = await signBuildIdentity({\n      buildIdentityPath: idPath,\n      privateKeyBytes: keyPair.privateKey,\n      publicKeyUrl: \"https://example.com/.well-known/release-pubkey.json\",\n    });\n\n    expect(result.signatureHex).toMatch(/^[0-9a-f]{128}$/);\n    expect(result.publicKeyHex).toMatch(/^[0-9a-f]{64}$/);\n    expect(result.publicKeyUrl).toBe(\"https://example.com/.well-known/release-pubkey.json\");\n    expect(result.signedAt).toMatch(/^\\d{4}-\\d{2}-\\d{2}T/);\n    expect(result.reusedExistingSignature).toBe(false);\n\n    const signed = JSON.parse(readFileSync(idPath, \"utf8\"));\n    expect(signed.signature).toBe(result.signatureHex);\n    expect(signed.publicKeyUrl).toBe(\"https://example.com/.well-known/release-pubkey.json\");\n    expect(signed.signedAt).toBe(result.signedAt);\n    expect(signed.distTreeHash).toBe(\"sha256:abc\");\n  });\n\n  it(\"reuses existing signature when payload hasn't changed (idempotency)\", async () => {\n    const idPath = join(tmpDir, \"build-identity.json\");\n    const baseIdentity = {\n      releaseId: \"test-r000001\",\n      systemId: \"test-site\",\n      missionId: \"m000001\",\n      semver: \"1.0.0\",\n      distTreeHash: \"sha256:abc\",\n      behaviorSnapshotHash: \"sha256:def\",\n      siteContentHash: \"sha256:ghi\",\n      platformVersion: \"6.0.0\",\n      platformSemanticHash: \"sha256:sem\",\n      commitSha: \"abc123\",\n      buildTimestamp: \"2026-08-23T12:00:00.000Z\",\n      targetPlatform: \"cloudflare\",\n    };\n    writeFileSync(idPath, JSON.stringify(baseIdentity));\n\n    const first = await signBuildIdentity({\n      buildIdentityPath: idPath,\n      privateKeyBytes: keyPair.privateKey,\n    });\n\n    const second = await signBuildIdentity({\n      buildIdentityPath: idPath,\n      privateKeyBytes: keyPair.privateKey,\n    });\n\n    expect(second.reusedExistingSignature).toBe(true);\n    expect(second.signatureHex).toBe(first.signatureHex);\n  });\n\n  it(\"produces new signature when payload has changed\", async () => {\n    const idPath = join(tmpDir, \"build-identity.json\");\n    writeFileSync(\n      idPath,\n      JSON.stringify({\n        releaseId: \"test-r000001\",\n        systemId: \"test-site\",\n        missionId: \"m000001\",\n        semver: \"1.0.0\",\n        distTreeHash: \"sha256:abc\",\n        behaviorSnapshotHash: \"sha256:def\",\n        siteContentHash: \"sha256:ghi\",\n        platformVersion: \"6.0.0\",\n        platformSemanticHash: \"sha256:sem\",\n        commitSha: \"abc123\",\n        buildTimestamp: \"2026-08-23T12:00:00.000Z\",\n        targetPlatform: \"cloudflare\",\n      }),\n    );\n\n    const first = await signBuildIdentity({\n      buildIdentityPath: idPath,\n      privateKeyBytes: keyPair.privateKey,\n    });\n\n    // Modify payload\n    const signed = JSON.parse(readFileSync(idPath, \"utf8\"));\n    signed.distTreeHash = \"sha256:changed\";\n    writeFileSync(idPath, JSON.stringify(signed));\n\n    const second = await signBuildIdentity({\n      buildIdentityPath: idPath,\n      privateKeyBytes: keyPair.privateKey,\n    });\n\n    expect(second.reusedExistingSignature).toBe(false);\n    expect(second.signatureHex).not.toBe(first.signatureHex);\n  });\n});\n\ndescribe(\"RFC-0931: writeReleasePublicKey\", () => {\n  it(\"writes release-pubkey.json to dist/client/.well-known/\", async () => {\n    const distDir = join(tmpDir, \"dist\");\n    const publicKeyHex = toHex(keyPair.publicKey);\n\n    const result = await writeReleasePublicKey({ distDir, publicKeyHex });\n\n    expect(existsSync(result)).toBe(true);\n    const content = JSON.parse(readFileSync(result, \"utf8\"));\n    expect(content.publicKeyHex).toBe(publicKeyHex);\n    expect(content.algorithm).toBe(\"Ed25519\");\n    expect(content.keyId).toMatch(/^[0-9a-f]{64}$/);\n    expect(content.createdAt).toMatch(/^\\d{4}-\\d{2}-\\d{2}T/);\n  });\n});\n\ndescribe(\"RFC-0931: verifyBuildIdentitySignature\", () => {\n  it(\"verifies a valid signature\", async () => {\n    const idPath = join(tmpDir, \"build-identity.json\");\n    const identity = {\n      releaseId: \"test-r000001\",\n      systemId: \"test-site\",\n      missionId: \"m000001\",\n      semver: \"1.0.0\",\n      distTreeHash: \"sha256:abc\",\n      behaviorSnapshotHash: \"sha256:def\",\n      siteContentHash: \"sha256:ghi\",\n      platformVersion: \"6.0.0\",\n      platformSemanticHash: \"sha256:sem\",\n      commitSha: \"abc123\",\n      buildTimestamp: \"2026-08-23T12:00:00.000Z\",\n      targetPlatform: \"cloudflare\",\n    };\n    writeFileSync(idPath, JSON.stringify(identity));\n\n    const signResult = await signBuildIdentity({\n      buildIdentityPath: idPath,\n      privateKeyBytes: keyPair.privateKey,\n    });\n\n    const signedIdentity = JSON.parse(readFileSync(idPath, \"utf8\"));\n    const valid = await verifyBuildIdentitySignature({\n      buildIdentity: signedIdentity,\n      publicKeyHex: signResult.publicKeyHex,\n    });\n\n    expect(valid).toBe(true);\n  });\n\n  it(\"rejects tampered build-identity.json\", async () => {\n    const idPath = join(tmpDir, \"build-identity.json\");\n    writeFileSync(\n      idPath,\n      JSON.stringify({\n        releaseId: \"test-r000001\",\n        systemId: \"test-site\",\n        missionId: \"m000001\",\n        semver: \"1.0.0\",\n        distTreeHash: \"sha256:abc\",\n        behaviorSnapshotHash: \"sha256:def\",\n        siteContentHash: \"sha256:ghi\",\n        platformVersion: \"6.0.0\",\n        platformSemanticHash: \"sha256:sem\",\n        commitSha: \"abc123\",\n        buildTimestamp: \"2026-08-23T12:00:00.000Z\",\n        targetPlatform: \"cloudflare\",\n      }),\n    );\n\n    const signResult = await signBuildIdentity({\n      buildIdentityPath: idPath,\n      privateKeyBytes: keyPair.privateKey,\n    });\n\n    const signedIdentity = JSON.parse(readFileSync(idPath, \"utf8\"));\n    signedIdentity.distTreeHash = \"sha256:tampered\";\n\n    const valid = await verifyBuildIdentitySignature({\n      buildIdentity: signedIdentity,\n      publicKeyHex: signResult.publicKeyHex,\n    });\n\n    expect(valid).toBe(false);\n  });\n\n  it(\"returns false when no signature present\", async () => {\n    const valid = await verifyBuildIdentitySignature({\n      buildIdentity: { releaseId: \"test\", distTreeHash: \"sha256:abc\" },\n      publicKeyHex: toHex(keyPair.publicKey),\n    });\n\n    expect(valid).toBe(false);\n  });\n});\n\ndescribe(\"RFC-0931: leitstand.verify --verify-signature\", () => {\n  it(\"signatureValid is null when --verify-signature is not set\", async () => {\n    vi.mocked(readSystemConfigSmart).mockResolvedValueOnce(defaultConfig as never);\n    vi.mocked(readSystemStateSmart).mockResolvedValueOnce(defaultState as never);\n    vi.spyOn(globalThis, \"fetch\").mockImplementation(() =>\n      Promise.resolve(new Response(mockBuildIdentity(\"sha256:abc123\"), { status: 200 })),\n    );\n\n    const result = await runLeitstandVerify(makeInput({ site: \"test-site\" }), makeContext(\"/tmp\"));\n\n    for (const ch of result.data!.channels) {\n      expect(ch.signatureValid).toBeNull();\n      expect(ch.publicKeyUrl).toBeNull();\n    }\n  });\n\n  it(\"signatureValid is true when signature matches public key\", async () => {\n    vi.mocked(readSystemConfigSmart).mockResolvedValueOnce(defaultConfig as never);\n    vi.mocked(readSystemStateSmart).mockResolvedValueOnce(defaultState as never);\n\n    const kp = await generateKeyPair();\n    const pubKeyHex = toHex(kp.publicKey);\n\n    // Create signed build-identity\n    const identity = {\n      distTreeHash: \"sha256:abc123\",\n      releaseId: \"r000005\",\n      missionId: \"m000076\",\n      buildTimestamp: \"2026-08-23T12:45:06Z\",\n    };\n    const idPath = join(tmpDir, \"build-identity.json\");\n    writeFileSync(idPath, JSON.stringify(identity));\n    await signBuildIdentity({\n      buildIdentityPath: idPath,\n      privateKeyBytes: kp.privateKey,\n    });\n    const signedIdentity = JSON.parse(readFileSync(idPath, \"utf8\"));\n\n    const pubKeyJson = JSON.stringify({\n      keyId: \"test-key-id\",\n      publicKeyHex: pubKeyHex,\n      algorithm: \"Ed25519\",\n      createdAt: \"2026-08-23T12:00:00.000Z\",\n    });\n\n    vi.spyOn(globalThis, \"fetch\").mockImplementation((url
