forgePlugin: false
# extract.config.yaml — repo-extract standalone package export for @warpgogol/werkstatt-engine
# Extracts packages/werkstatt from the werkstatt monorepo into a standalone private repo.
# RFC-0773: Engine publication pipeline via repo-extract to private npm.
# RFC-1254: standalone test classification — monorepo-only exclusions with justifications.

projectDir: packages/werkstatt-engine
destName: werkstatt-engine
standalone: true

workspacePrefixes:
  - "@warpgogol/"
stripScopes:
  - "@warpgogol/"
preservePackages:
  - "@warpgogol/werkstatt-engine"
  - "@warpgogol/werkstatt-shared"
  - "@warpgogol/forge"
stubPackages:
  - "@warpgogol/werkstatt-site"
packageManager: pnpm

ci:
  provider: github-actions
  publish: true
  nodeVersion: 24

ignoreDirs:
  - .turbo
  - .agents
  - node_modules
  - tmp-*

excludePathSegments:
  - .npmrc
  - src/tests
  # monorepo-only: runProbe end-to-end reads the monorepo repo outside package
  - src/kernel/tests/rfc-acceptance.test.ts
  # monorepo-only: reads docs/architecture-dna.md outside package
  - src/kernel/tests/rfc-create.test.ts
  # monorepo-only: loads @warpgogol/werkstatt-site module surface (stubbed in extract)
  - src/kernel/tests/command-manifest.test.ts
  # monorepo-only: loads @warpgogol/werkstatt-site module surface (stubbed in extract)
  - src/kernel/workflow/tests/handlers.test.ts
  # monorepo-only: reads src/tests-handoff/helpers/ (absent via src/tests segment match)
  - src/mission/rfc-1218-generated-conflicts.test.ts
  # monorepo-only: reads src/tests-handoff/helpers/ (absent via src/tests segment match)
  - src/mission/rfc-1219-rewind-preservation.test.ts
  # monorepo-only: reads src/tests-handoff/helpers/ (absent via src/tests segment match)
  - src/mission/rfc-1221-fold-merged-shas.test.ts
  - pnpm-lock.yaml

postProcess:
  - action: delete
    path: AGENTS.md
  - action: delete
    path: pnpm-lock.yaml
  - action: copy
    from: packages/werkstatt-engine/pnpm-workspace.override.yaml
    to: pnpm-workspace.yaml

git:
  remote: git@github.com:syrokomskyi/werkstatt-engine.git
  autoPush: true
  # RFC-1252/repo-extract >=1.4.0: non-fast-forward push after history
  # transfer reconciles via fetch + merge -s ours + retry. Never force-push.
  autoReconcile: true
